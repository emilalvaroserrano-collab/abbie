[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abbiecsr-livekit-worker"
version = "1.0.0"
description = "ABI Tech AbbieCSR LiveKit voice worker"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.8,<2",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools]
py-modules = []
